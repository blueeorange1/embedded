<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Voiles Browser</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        background: #111;
        color: #eee;
      }
      #bar {
        padding: 10px 16px;
        background: #1c1c1c;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      button {
        padding: 8px 14px;
        cursor: pointer;
      }
      button:disabled {
        cursor: wait;
        opacity: 0.6;
      }
      input {
        flex: 1;
        max-width: 560px;
        padding: 8px 10px;
        border: 1px solid #444;
        border-radius: 4px;
        background: #111;
        color: #eee;
      }
      #status {
        font-size: 14px;
        opacity: 0.8;
      }
      #frame-wrap {
        width: 100%;
        height: calc(100vh - 50px);
      }
      iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <input id="url" type="url" placeholder="https://example.com" value="https://www.facebook.com/marketplace" aria-label="URL to open" />
      <button id="start">Open Link</button>
      <span id="status"></span>
    </div>
    <div id="frame-wrap"></div>

    <script src="./config.js"></script>
    <script>
      const apiBaseUrl = window.APP_CONFIG?.apiBaseUrl || '';
      const startButton = document.getElementById('start');
      const urlInput = document.getElementById('url');
      let opening = false;

      async function openLink() {
        if (opening) return;

        const status = document.getElementById('status');
        const url = urlInput.value.trim();

        let destination;
        try {
          destination = new URL(url);
          if (!['http:', 'https:'].includes(destination.protocol)) {
            throw new Error('Only HTTP and HTTPS links are supported.');
          }
        } catch (err) {
          status.textContent = 'Error: ' + (err.message || 'Enter a valid URL.');
          urlInput.focus();
          return;
        }

        opening = true;
        startButton.disabled = true;
        status.textContent = 'Starting remote browser...';
        try {
          const res = await fetch(apiBaseUrl + '/api/session?url=' + encodeURIComponent(destination.href));
          const data = await res.json();
          if (data.error) throw new Error(data.error);

          status.textContent = 'Session ' + data.id + ' loading';

          const iframe = document.createElement('iframe');
          // interactive=true lets you click/type; showControls=true adds a URL bar
          iframe.src = data.viewerUrl + '?interactive=true&showControls=true';
          iframe.setAttribute('allow', 'clipboard-read; clipboard-write');
          const wrap = document.getElementById('frame-wrap');
          wrap.innerHTML = '';
          wrap.appendChild(iframe);
        } catch (err) {
          status.textContent = 'Error: ' + err.message;
        } finally {
          opening = false;
          startButton.disabled = false;
        }
      }

      startButton.onclick = openLink;
      urlInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') openLink();
      });
    </script>
  </body>
</html>
